
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAZYBAR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .menu {
      max-width: 600px;
      margin: 40px auto;
      background: #080808;
      border: 1px solid #8c7025;
      border-radius: 15px;
      overflow: hidden;
    }

    header {
      padding: 25px 10px;
    }

    h1 {
      margin: 0;
      color: #e8bb36;
      font-size: 38px;
      letter-spacing: 3px;
    }

    header p {
      color: #bbb;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .botones {
      display: flex;
      gap: 8px;
      padding: 15px;
    }

    button {
      flex: 1;
      padding: 13px 5px;
      border: none;
      border-radius: 6px;
      background: #d9ad28;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover,
    button.activo {
      background: #fff;
    }

    #contenido {
      padding: 15px;
      color: #e8bb36;
      min-height: 55px;
    }

    .datos {
      padding: 20px 10px;
      border-top: 1px solid #8c7025;
      line-height: 1.8;
    }

    .datos h2 {
      color: #e8bb36;
      font-size: 18px;
    }

    .datos p {
      margin: 5px;
      color: #ddd;
      font-size: 14px;
    }

    .datos a {
      color: #e8bb36;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="menu">

    <header>
      <h1>CRAZYBAR</h1>
      <p>RESTAURANTE</p>
    </header>

    <div class="botones">
      <button onclick="mostrar('COMIDA', this)">COMIDA</button>
      <button onclick="mostrar('BEBIDAS', this)">BEBIDAS</button>
      <button onclick="mostrar('PROMOCIONES', this)">PROMOCIONES</button>
    </div>

    <div id="contenido"></div>

    <div class="datos">
      <h2>CRAZYBAR</h2>
      <p>Av. 5 de Abril 5187 - Estación Central</p>
      <p>Reservas: +56 9 6482 3001</p>
      <p>De lunes a domingo</p>
      <p>
        <a href="https://www.instagram.com/crazybarcl/" target="_blank">
          @CRAZYBARCL
        </a>
      </p>
    </div>

  </div>

  <script>
    function mostrar(seccion, boton) {
      document.getElementById("contenido").innerHTML =
        "<h2>" + seccion + "</h2>";

      let botones = document.querySelectorAll("button");

      botones.forEach(function(b) {
        b.classList.remove("activo");
      });

      boton.classList.add("activo");
    }
  </script>

</body>
</html>
